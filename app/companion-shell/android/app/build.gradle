apply plugin: 'com.android.application'

// The Play upload key, for `bundleRelease`. Play re-signs with the app
// signing key it holds (Play App Signing); this one only proves an upload
// is ours. It never enters the repository: `android/keystore.properties`
// (gitignored) or the environment names the keystore and its passwords.
// Without either, a release build is left unsigned, which Play refuses.
def uploadKey = new Properties()
def uploadKeyFile = rootProject.file('keystore.properties')
if (uploadKeyFile.exists()) {
    uploadKeyFile.withInputStream { uploadKey.load(it) }
}
def uploadKeyValue = { String name, String env ->
    uploadKey.getProperty(name) ?: System.getenv(env)
}
def uploadStoreFile = uploadKeyValue('storeFile', 'GAVIN_ANDROID_UPLOAD_KEYSTORE')

android {
    namespace = "com.gavin.companion"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gavin.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Each upload to Play needs a higher versionCode; the store
        // wizard passes it (-PversionCodeOverride=N), a plain build is 1.
        versionCode((project.findProperty('versionCodeOverride') ?: '1') as Integer)
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadStoreFile) {
            upload {
                storeFile rootProject.file(uploadStoreFile)
                storePassword uploadKeyValue('storePassword', 'GAVIN_ANDROID_UPLOAD_STORE_PASSWORD')
                keyAlias uploadKeyValue('keyAlias', 'GAVIN_ANDROID_UPLOAD_KEY_ALIAS')
                keyPassword uploadKeyValue('keyPassword', 'GAVIN_ANDROID_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadStoreFile) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // addWebMessageListener: the origin-gated channel into the bundle's webview.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Reading the pairing QR: Google Play services runs the camera and
    // hands back only the code, so the app holds no camera permission.
    implementation "com.google.android.gms:play-services-code-scanner:$playServicesCodeScannerVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
