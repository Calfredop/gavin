<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 8-bit glyphs drawn on a 32px pixel grid: 1px strokes on a 12px-tall
       body, so the letterforms stay blocky but read thin and open. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32323a"/>
      <stop offset="1" stop-color="#161619"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircleClip)">
    <rect x="100" y="100" width="824" height="116" fill="url(#barSheen)"/>
    <line x1="100" y1="216" x2="924" y2="216" stroke="#000000" stroke-opacity="0.35" stroke-width="3"/>
    <!-- traffic lights as pixel-art octagons (two crossed rects each) -->
    <g fill="#e0524a">
      <rect x="200" y="140" width="20" height="36"/>
      <rect x="192" y="148" width="36" height="20"/>
    </g>
    <g fill="#d9a648">
      <rect x="260" y="140" width="20" height="36"/>
      <rect x="252" y="148" width="36" height="20"/>
    </g>
    <g fill="#8bc98b">
      <rect x="320" y="140" width="20" height="36"/>
      <rect x="312" y="148" width="36" height="20"/>
    </g>
  </g>

  <!-- pixel-art ">" chevron: 1px stair-step, 7x12 cells -->
  <g fill="#8bc98b">
    <rect x="192" y="378" width="64" height="32"/>
    <rect x="224" y="410" width="64" height="32"/>
    <rect x="256" y="442" width="64" height="32"/>
    <rect x="288" y="474" width="64" height="32"/>
    <rect x="320" y="506" width="64" height="32"/>
    <rect x="352" y="538" width="64" height="64"/>
    <rect x="320" y="602" width="64" height="32"/>
    <rect x="288" y="634" width="64" height="32"/>
    <rect x="256" y="666" width="64" height="32"/>
    <rect x="224" y="698" width="64" height="32"/>
    <rect x="192" y="730" width="64" height="32"/>
  </g>

  <!-- pixel-art "G": 1px stroke, chamfered corners, 10x12 cells -->
  <g fill="#ececec">
    <rect x="576" y="378" width="192" height="32"/>
    <rect x="544" y="410" width="32" height="32"/>
    <rect x="768" y="410" width="32" height="32"/>
    <rect x="800" y="442" width="32" height="32"/>
    <rect x="512" y="442" width="32" height="256"/>
    <rect x="704" y="570" width="128" height="32"/>
    <rect x="800" y="602" width="32" height="96"/>
    <rect x="544" y="698" width="32" height="32"/>
    <rect x="768" y="698" width="32" height="32"/>
    <rect x="576" y="730" width="192" height="32"/>
  </g>

  <rect x="102" y="102" width="820" height="820" rx="182" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
</svg>
