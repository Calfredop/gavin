<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32323a"/>
      <stop offset="1" stop-color="#161619"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircleClip)">
    <rect x="100" y="100" width="824" height="132" fill="url(#barSheen)"/>
    <line x1="100" y1="232" x2="924" y2="232" stroke="#000000" stroke-opacity="0.35" stroke-width="3"/>
    <rect x="188" y="146" width="40" height="40" fill="#e0524a"/>
    <rect x="258" y="146" width="40" height="40" fill="#d9a648"/>
    <rect x="328" y="146" width="40" height="40" fill="#8bc98b"/>
  </g>

  <!-- pixel-art ">" chevron -->
  <g fill="#8bc98b">
    <rect x="152" y="386" width="96" height="48"/>
    <rect x="152" y="434" width="144" height="48"/>
    <rect x="200" y="482" width="144" height="48"/>
    <rect x="248" y="530" width="144" height="96"/>
    <rect x="200" y="626" width="144" height="48"/>
    <rect x="152" y="674" width="144" height="48"/>
    <rect x="152" y="722" width="96" height="48"/>
  </g>

  <!-- pixel-art "G" -->
  <g fill="#ececec">
    <rect x="536" y="386" width="288" height="48"/>
    <rect x="488" y="434" width="384" height="48"/>
    <rect x="488" y="482" width="96" height="48"/>
    <rect x="488" y="530" width="96" height="48"/>
    <rect x="488" y="578" width="96" height="48"/>
    <rect x="680" y="578" width="192" height="48"/>
    <rect x="488" y="626" width="96" height="48"/>
    <rect x="776" y="626" width="96" height="48"/>
    <rect x="488" y="674" width="384" height="48"/>
    <rect x="536" y="722" width="288" height="48"/>
  </g>

  <rect x="102" y="102" width="820" height="820" rx="182" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
</svg>
