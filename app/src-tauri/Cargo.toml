[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The Dock/taskbar shows the process name in dev mode (no .app bundle), so the
# binary must be named Gavin for it to read as Gavin there.
[[bin]]
name = "Gavin"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toml = "0.8"
toml_edit = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
# The update channel (R6/SC-06). Registered conditionally in lib.rs --
# its Config makes `pubkey` required, and tauri hands a missing
# `plugins.updater` block to a plugin as JSON null, which fails to
# deserialize and takes the whole app down at startup.
tauri-plugin-updater = "2"
# Already in the graph through tauri and the updater plugin; named here
# because updater.rs parses the endpoint override with it.
url = "2"
# The same OS randomness tauri mints its own CSP nonces from -- used
# for the confirmation tokens in confirm_gate.rs. Already in the graph
# through tauri itself, so this adds an edge rather than a crate.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
notify = "8"
notify-debouncer-mini = "0.7"
protocol = { path = "../../crates/protocol" }
# The OS Trash, not `rm`: the delete wizard removes somebody's cards, and
# a card in plans/done/ that git never tracked is otherwise gone for good.
# default-features off drops `coinit_apartmentthreaded` (Windows COM) and
# `chrono`; on macOS, where NsFileManager does the whole job, chrono only
# exists to read Trash timestamps back and gavin only ever puts things in.
trash = { version = "5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# chrono back on, and NOT for reading. The freedesktop backend gates the
# `DeletionDate=` line of the `.trashinfo` file it writes on this feature
# (trash-5.2.6 src/freedesktop.rs:521), and the trash spec makes that key
# mandatory -- without it a trashed workspace is one file managers list
# with no date and, depending on the implementation, decline to put back.
# "Restorable" is the entire promise trash_path makes over `rm`.
trash = { version = "5", default-features = false, features = ["chrono"] }

[target.'cfg(unix)'.dependencies]
# `daemon.rs` stops the daemon by pid now, not by name, and `kill` is the
# whole of that on unix. The macOS block below asks for the same crate
# for its own reasons; cargo merges the two.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# The other half of the same thing: OpenProcess/TerminateProcess, so
# `daemon.rs` reaches exactly the process serving the socket instead of
# shelling out to `taskkill /IM`. Same crate and version the daemon's
# `proc.rs` already pins.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# COM back on, and it is not optional. The Windows backend is
# IFileOperation, and trash-5.2.6 src/windows.rs:278 is a deliberate
# compile error when neither `coinit_apartmentthreaded` nor
# `coinit_multithreaded` is selected -- CoInitializeEx has to be told a
# threading model and the crate refuses to guess one. Apartment-threaded
# is what default-features would have brought and what the shell APIs
# expect; the multithreaded arm exists for callers already in an MTA.
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The memory probe: sysctlbyname for the machine's own figures and
# proc_pidinfo for watchman's, exactly as crates/daemon/src/proc.rs
# reads a session's. macOS-only because both are, and because the
# probe already answers "unsupported" everywhere else.
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow", "NSView", "NSResponder", "NSEvent", "NSScreen", "block2"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[dev-dependencies]
tempfile = "3"

