[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The Dock/taskbar shows the process name in dev mode (no .app bundle), so the
# binary must be named Gavin for it to read as Gavin there.
[[bin]]
name = "Gavin"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toml = "0.8"
toml_edit = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
# The same OS randomness tauri mints its own CSP nonces from -- used
# for the confirmation tokens in confirm_gate.rs. Already in the graph
# through tauri itself, so this adds an edge rather than a crate.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
notify = "8"
notify-debouncer-mini = "0.7"
protocol = { path = "../../crates/protocol" }
# The OS Trash, not `rm`: the delete wizard removes somebody's cards, and
# a card in plans/done/ that git never tracked is otherwise gone for good.
# default-features off drops the `chrono` feature, which only exists to
# read Trash timestamps back -- gavin only ever puts things in.
trash = { version = "5", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow", "NSView", "NSResponder", "NSEvent", "NSScreen", "block2"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[dev-dependencies]
tempfile = "3"

