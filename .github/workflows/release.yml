# Builds the artefacts a human could hand to somebody else, and refuses to
# build anything else.
#
# The audit's R6 (SC-06/07/08) is one sentence: nothing distinguishes
# gavin's bundle from a modified one. The daemon owns every session's PTY,
# stdin and queued input, and the absolute path of `gavin-mcp` is written
# into each workspace's agent config, so both ride inside the bundle and
# both are what an attacker would want to replace. A signature over the
# whole bundle is the only thing that makes such a replacement detectable,
# and notarization is the only thing that lets a first launch succeed
# without teaching the human the "Open Anyway" habit that makes a modified
# bundle indistinguishable from the real one.
#
# Three deliberate choices:
#
# * `preflight` fails the run when a signing secret is missing, BEFORE any
#   platform starts building. Tauri's bundler treats a missing identity as
#   "skip signing" and prints a line; that is the right default for a
#   developer build and exactly the wrong one here, because the output
#   still looks like a release. The gate is what makes an unsigned release
#   impossible rather than merely unlikely.
#
# * Every job's verification step runs AFTER the build and fails the job.
#   Building it signed and checking it is signed are different claims.
#
# * The workflow token stays `contents: read` and this workflow publishes
#   no RELEASE. It produces verified artefacts; attaching them to a release
#   is a deliberate human act, and giving a tag-triggered workflow write
#   access to the repository is a bigger hole than the one it would close.
#   See docs/RELEASING.md. The one exception is the `images` job, which
#   pushes the Relay's and the Push gateway's container images to GHCR:
#   an image has no other place to be, so that job alone holds
#   `packages: write` and `id-token: write` (its own `permissions:`, never
#   widened for the rest), and signs what it pushed keylessly.
#
# The updater is the fourth thing this workflow produces. `tauri build`
# gets `tauri.updater.conf.json` on top of the usual overlay, which is
# the only place `bundle.createUpdaterArtifacts` is set -- deliberately
# NOT in `tauri.conf.json`, because the CLI turns "a pubkey is configured
# and artefacts were asked for" into a hard error when
# `TAURI_SIGNING_PRIVATE_KEY` is absent, and that would break the
# `npm run bundle` on a laptop that docs/RELEASING.md says is fine for
# testing the packaging. A release has the key; a laptop does not; the
# overlay is where the two part company.
#
# The `manifest` job then writes `latest.json` from the signatures the
# three build jobs produced. It is composed here rather than by hand
# because a signature pasted into a file by a human is a signature that
# can be pasted wrong, and the failure mode -- every install refuses
# every update, or worse, one platform silently gets another's build --
# is not one anybody notices until the next release. That job also makes
# the check Tauri does not: its CLI compares the signing key against the
# configured pubkey and, on a mismatch, prints a warning and carries on.
# A release signed with the wrong key is then a green build that no
# install will ever accept an update from. Here it is a red job.
#
# Third-party actions are pinned to a full commit SHA (tag in a trailing
# comment) for the reason ci.yml states: a tag can be moved by whoever
# holds it, a SHA cannot.
#
# WHAT HAS ACTUALLY RUN. The macOS path was exercised end to end on a
# developer Mac with an ad-hoc identity: the bundler signs both sidecars
# and then seals the bundle around them, a replaced
# `Contents/MacOS/gavin-daemon` makes `codesign --verify --deep --strict`
# report "nested code is modified or invalid", and
# scripts/verify-macos-bundle.sh catches both that and a missing sidecar.
# Everything that needs a real Developer ID (notarization, stapling, the
# Gatekeeper assessment) and the whole of the Linux and Windows jobs have
# never run: there is no certificate, no key and no runner yet. Expect the
# first tagged release to need fixes here, and treat a red job on it as
# information rather than as a regression.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (secrets and version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A tag that disagrees with the version inside the bundle is a
      # release nobody can trace back to a commit. Check it before paying
      # for three build hosts.
      - name: The tag and bundle.version agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, tauri.conf.json says $conf" >&2
            exit 1
          fi
          echo "version $conf"

      # An empty `pubkey` deserializes perfectly well and then fails
      # every signature at runtime, which reads to a user as "the update
      # server is broken" rather than as "this build can verify nothing".
      # It is also what the repository carries until somebody generates
      # the keypair, so this is the gate that stops a placeholder being
      # released by accident. See the key custody section of
      # docs/RELEASING.md.
      - name: An update key is pinned
        run: |
          pubkey=$(node -p "require('./app/src-tauri/tauri.conf.json').plugins?.updater?.pubkey ?? ''")
          if [ -z "$pubkey" ]; then
            echo "plugins.updater.pubkey in app/src-tauri/tauri.conf.json is empty" >&2
            echo "generate a keypair (npx tauri signer generate) and commit the PUBLIC half" >&2
            exit 1
          fi
          echo "update key pinned (${#pubkey} chars)"

      # The Companion bundle's publisher key (ADR 0005): a store build of
      # the Companion runs only a bundle signed by the key the shell pins,
      # so a release signed by any other key -- or none -- would be a
      # green build whose UI every phone refuses. The seed is the
      # secret; its public half is derived here and compared with the
      # pinned one. Until the key is made and pinned (docs/RELEASING.md,
      # "The Companion bundle key"), the pin is null and this gate fails,
      # which is the point: a release cannot ship a bundle nobody can run.
      - name: The Companion bundle key is the pinned one
        env:
          GAVIN_BUNDLE_SIGNING_KEY: ${{ secrets.GAVIN_BUNDLE_SIGNING_KEY }}
        run: |
          pinned=$(node -e "const s=require('fs').readFileSync('app/companion-shell/src/shell/bundle/publisherKey.ts','utf8'); const m=s.match(/PUBLISHER_KEY[^=]*=\\s*\"([0-9a-f]{64})\"/); console.log(m ? m[1] : '')")
          if [ -z "$pinned" ]; then
            echo "app/companion-shell/src/shell/bundle/publisherKey.ts pins no publisher key" >&2
            echo "run node app/src-tauri/companion-key.mjs generate, keep the seed as GAVIN_BUNDLE_SIGNING_KEY and pin the public key" >&2
            exit 1
          fi
          if [ -z "$GAVIN_BUNDLE_SIGNING_KEY" ]; then
            echo "missing secret: GAVIN_BUNDLE_SIGNING_KEY" >&2
            exit 1
          fi
          derived=$(node app/src-tauri/companion-key.mjs public "$GAVIN_BUNDLE_SIGNING_KEY")
          if [ "$derived" != "$pinned" ]; then
            echo "GAVIN_BUNDLE_SIGNING_KEY is not the key publisherKey.ts pins (${derived:0:12}… vs ${pinned:0:12}…)" >&2
            exit 1
          fi
          echo "bundle key pinned (${pinned:0:12}…)"

      # Named one at a time so the failure says WHICH one is missing. A
      # secret is never echoed -- only whether it is empty.
      - name: Every signing secret is present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required here, unlike
          # LINUX_GPG_KEY_PASSWORD which is optional: `tauri signer
          # generate` will happily make an unencrypted key, and this is
          # the one key whose leak lets somebody push code to every
          # install that exists. The CLI treats a missing password in CI
          # as an empty one, so nothing else would ever complain.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 \
                      WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
                      LINUX_GPG_KEY LINUX_GPG_KEY_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "missing secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "see docs/RELEASING.md for what each one is and who holds it" >&2
            exit 1
          fi
          echo "all signing secrets present"

  macos:
    name: macOS (${{ matrix.arch }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per architecture rather than a universal binary:
          # stage-sidecars.mjs stages `gavin-daemon`/`gavin-mcp` under the
          # HOST triple from `rustc -vV`, which is the target triple only
          # when the two match. A universal build would need the sidecars
          # lipo'd under a fourth name; two runners cost less than that
          # machinery and produce the same two downloads.
          #
          # `macos-15-intel`, not `macos-13`: GitHub retired the macOS 13
          # image on 2025-12-04, so that label no longer gets a runner. 15
          # rather than `macos-26-intel` to keep this leg on the same OS and
          # SDK as the aarch64 one; move the two together.
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # The App Store Connect key has to be a FILE on disk: the bundler
      # passes APPLE_API_KEY_PATH to `notarytool --key`. Written outside
      # the workspace so no later step can sweep it into an artefact, and
      # removed again whatever happens.
      - name: Write the notarization key
        env:
          # Through `env:`, never `${{ }}` inside `run:`. An expression is
          # pasted into the script before the shell sees it, so a secret
          # is one stray quote away from being executed rather than
          # written; an environment variable is only ever data.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary/AuthKey.p8"

      # APPLE_CERTIFICATE + APPLE_CERTIFICATE_PASSWORD: the Tauri CLI
      # imports the base64 .p12 into a throwaway keychain itself, so
      # nothing here touches the login keychain.
      # APPLE_API_* present means the bundler notarizes and staples in the
      # same run; absent, it signs and silently skips notarization, which
      # is what preflight exists to prevent.
      # Not `npm run bundle`: the updater overlay has to sit before the
      # `--` that starts cargo's own arguments, and npm appends whatever
      # follows `--` to the END of the script. Same reason the Windows
      # job spells its build out.
      - name: Build, sign, notarize
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GAVIN_BUNDLE_SIGNING_KEY: ${{ secrets.GAVIN_BUNDLE_SIGNING_KEY }}
          CI: true
        run: >
          npx tauri build
          --config src-tauri/tauri.bundle.conf.json
          --config src-tauri/tauri.updater.conf.json
          -- --locked

      - name: Delete the notarization key
        if: always()
        run: rm -rf "$RUNNER_TEMP/notary"

      # No --allow-adhoc: signed, hardened, one team, no entitlement
      # granted, Gatekeeper-accepted and stapled, or the job is red.
      - name: Verify the bundle
        run: ./scripts/verify-macos-bundle.sh "target/release/bundle/macos/Gavin.app"

      # And again on the copy inside the .dmg, because that is the one a
      # human downloads. Verifying the build directory proves the bundler
      # signed something; verifying the disk image proves the thing that
      # ships is what was signed.
      - name: Verify the app inside the disk image
        run: |
          set -euo pipefail
          dmg=$(find target/release/bundle/dmg -name '*.dmg' | head -1)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          ./scripts/verify-macos-bundle.sh "$mnt/Gavin.app"

      # The updater artefact is `Gavin.app.tar.gz`, and the bundler gives
      # it that name on BOTH architectures -- so the two would collide
      # the moment a human attached them to one GitHub release. Renamed
      # per arch here, which is safe: verification is over the file's
      # bytes against the signature named in latest.json, and neither
      # cares what the file is called.
      - name: Name the updater artefact for this architecture
        run: |
          set -euo pipefail
          cd target/release/bundle/macos
          mv Gavin.app.tar.gz "Gavin_${{ matrix.arch }}.app.tar.gz"
          mv Gavin.app.tar.gz.sig "Gavin_${{ matrix.arch }}.app.tar.gz.sig"
          test -s "Gavin_${{ matrix.arch }}.app.tar.gz.sig"

      # The .dmg is what a human downloads; the .tar.gz is what the
      # updater downloads. A .app is neither: it is a directory of
      # symlinks and extended attributes, and actions/upload-artifact
      # zips it, so what comes back down no longer verifies. Both of the
      # files here survive the round trip -- the disk image with its
      # signature and its stapled ticket, the tarball because a tarball
      # is a file.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gavin-macos-${{ matrix.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  linux:
    name: Linux
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Same list ci.yml installs; the bundler additionally wants patchelf
      # and the AppImage tooling's fuse dependency.
      - name: Install the GTK/WebKit stack and the bundler's tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GAVIN_BUNDLE_SIGNING_KEY: ${{ secrets.GAVIN_BUNDLE_SIGNING_KEY }}
          CI: true
        run: >
          npx tauri build
          --config src-tauri/tauri.bundle.conf.json
          --config src-tauri/tauri.updater.conf.json
          -- --locked

      # Linux has no OS-level code signature to attach, so the artefacts
      # get a detached OpenPGP signature over each file and a signed
      # checksum list. That is the whole trust story on this platform:
      # publish the public key once, and `gpg --verify` is what a
      # downloader runs. If gavin ever ships an apt/dnf repository, this is
      # the key that signs its metadata too -- see docs/RELEASING.md.
      - name: Sign every artefact
        env:
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_KEY_PASSWORD: ${{ secrets.LINUX_GPG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s' "$LINUX_GPG_KEY" | base64 --decode | gpg --batch --import
          cd target/release/bundle
          # The updater's own `.sig` files (minisign, over the same
          # artefacts) are deliberately not in this list: they are not
          # downloads, and signing a signature would only invite somebody
          # to check the wrong one.
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          sign() {
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${LINUX_GPG_KEY_PASSWORD:-}" \
                --local-user "$LINUX_GPG_KEY_ID" \
                --armor --detach-sign "$1"
          }
          sign SHA256SUMS
          while IFS= read -r f; do sign "$f"; done < <(
            find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \)
          )
          gpg --verify SHA256SUMS.asc SHA256SUMS

      # Same check the macOS script's step [1] makes, in the one form a
      # .deb allows. On a first run, the listing is printed when it fails
      # so the real install prefix is visible rather than guessed at.
      - name: The sidecars shipped
        run: |
          set -uo pipefail
          deb=$(find target/release/bundle -name '*.deb' | head -1)
          listing=$(dpkg-deb -c "$deb")
          missing=0
          for bin in gavin-daemon gavin-mcp; do
            if printf '%s' "$listing" | grep -qE "/$bin\$"; then
              echo "ok    $bin is in the package"
            else
              echo "FAIL  $bin is not in the package"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then printf '%s\n' "$listing"; exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gavin-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/SHA256SUMS*
            target/release/bundle/**/*.asc
          if-no-files-found: error

  windows:
    name: Windows
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # Tauri's Windows signing wants a certificate THUMBPRINT in the
      # config and the key in the machine's store -- there is no env var
      # for it, unlike macOS. So: import the PFX, read the thumbprint the
      # import produced, and hand it to `tauri build` as a config overlay.
      # A generated overlay rather than a committed one because a
      # thumbprint identifies the certificate and belongs with the secret,
      # not in the repository.
      #
      # This PFX route works for a private or legacy certificate. A
      # publicly trusted code-signing certificate bought today cannot be
      # exported into a secret at all: since mid-2023 the CA/Browser Forum
      # requires its private key to live on certified hardware or in a
      # cloud signing service. For one of those, replace this step with the
      # provider's authentication and set `bundle.windows.signCommand`
      # instead of a thumbprint. See docs/RELEASING.md.
      - name: Import the code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          $overlay = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } }
          $overlay | ConvertTo-Json -Depth 5 |
            Set-Content -Path 'app/src-tauri/tauri.signing.conf.json' -Encoding utf8
          "thumbprint length: $($cert.Thumbprint.Length)"

      # Not `npm run bundle`: the extra --config has to sit before the
      # `--` that starts cargo's own arguments, and npm appends whatever
      # follows `--` to the END of the script.
      - name: Build and sign
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GAVIN_BUNDLE_SIGNING_KEY: ${{ secrets.GAVIN_BUNDLE_SIGNING_KEY }}
          CI: true
        run: >
          npx tauri build
          --config src-tauri/tauri.bundle.conf.json
          --config src-tauri/tauri.signing.conf.json
          --config src-tauri/tauri.updater.conf.json
          -- --locked

      - name: Remove the generated overlay
        if: always()
        shell: pwsh
        run: Remove-Item 'app/src-tauri/tauri.signing.conf.json' -ErrorAction SilentlyContinue

      # signtool is the only thing that can answer "is this actually
      # signed": the bundler prints a line either way.
      - name: Verify the installer is signed and timestamped
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName | Select-Object -Last 1
          $failed = $false
          # -Filter, not -Include: with -Recurse, -Include only matches
          # when the path itself ends in a wildcard, so the naive spelling
          # silently finds nothing and the loop "passes".
          Get-ChildItem -Path 'target/release/bundle' -Recurse -Filter '*.exe' | ForEach-Object {
            & $signtool.FullName verify /pa /tw $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'an artefact is unsigned or untimestamped' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gavin-windows-x86_64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  # The Relay's and the Push gateway's container images: built, pushed to
  # GHCR, signed, and verified from the registry.
  #
  # A self-hoster's promise (spec stories 69 and 75) is "this image came
  # from that tag, and nobody touched it since", checkable without trusting
  # the publisher's word. Two choices make it so:
  #
  # * SIGNED BY DIGEST. A tag is a pointer somebody can move; a digest is
  #   the content. `cosign sign` is handed `repo@sha256:...`, never
  #   `repo:tag`, and the digests are printed into `image-digests.md` for
  #   the release notes, so a self-hoster pins the same string the
  #   signature covers.
  #
  # * KEYLESS. The signature is bound to THIS workflow file on a `v*` tag
  #   through the run's OIDC identity and recorded in Sigstore's public
  #   log. There is no image-signing key to leak, rotate or lose, which
  #   is the failure the updater key section of docs/RELEASING.md
  #   spends a page on. `cosign verify` below (and the self-hosting doc)
  #   pins that identity, not a key.
  #
  # cosign is built with `go install` at a pinned version rather than
  # fetched by a third-party action or a curl: the Go module proxy checks
  # the source against the public checksum database, which is a stronger
  # statement than any tag on an action repository.
  images:
    name: Container images (Relay, Push gateway)
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      COSIGN_VERSION: v2.4.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cosign
        run: go install "github.com/sigstore/cosign/v2/cmd/cosign@${COSIGN_VERSION}"

      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Pushed by digest only: the tag is a courtesy for humans reading
      # the registry page, and nothing in this job or in the docs relies
      # on it. `--metadata-file` is where the digest of what was actually
      # pushed comes from -- read back, never computed.
      - name: Build, push and sign
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          # Manual runs are not on a tag; the signing identity below only
          # accepts a tag, so a dispatch builds and pushes under a
          # `dispatch-<run>` tag and its signature would not verify as a
          # release. That is deliberate: a release is a tag.
          ref="${TAG//\//-}"
          : > image-digests.md
          printf '| Image | Digest |\n|---|---|\n' >> image-digests.md
          for spec in "gavin-relay crates/gavin-relay/Dockerfile" \
                      "gavin-push-gateway crates/push-gateway/Dockerfile"; do
            set -- $spec
            name=$1; dockerfile=$2
            image="ghcr.io/$owner/$name"
            docker buildx build --push \
              --file "$dockerfile" \
              --tag "$image:$ref" \
              --label "org.opencontainers.image.source=https://github.com/$REPO" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$ref" \
              --metadata-file "$name.metadata.json" \
              .
            digest=$(node -p "require('./$name.metadata.json')['containerimage.digest']")
            case "$digest" in
              sha256:????????????????????????????????????????????????????????????????) ;;
              *) echo "no digest for $name: '$digest'" >&2; exit 1 ;;
            esac
            cosign sign --yes "$image@$digest"
            printf '| `%s` | `%s` |\n' "$image" "$digest" >> image-digests.md
            echo "$image@$digest" >> image-refs.txt
          done
          cat image-digests.md

      # Verified from the registry, by digest, with the identity a
      # self-hoster is told to use. Signing an image and checking that
      # the signature verifies the way the docs say are different claims;
      # this is what keeps the docs' command honest.
      - name: Verify the signatures the way docs/self-hosting-relay.md says
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          while IFS= read -r ref; do
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${REPO}/\.github/workflows/release\.yml@refs/tags/v" \
              "$ref" > /dev/null
            echo "verified $ref"
          done < image-refs.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gavin-image-digests
          path: |
            image-digests.md
            image-refs.txt
          if-no-files-found: error

  # The manifest every install polls, written from the signatures the
  # three build jobs actually produced.
  #
  # It is composed here rather than by hand for the reason the header
  # gives: a base64 signature pasted into a file by a human is a
  # signature that can be pasted into the wrong platform's entry, and
  # nobody finds out until an install refuses an update -- or accepts one
  # meant for another architecture and then fails to launch.
  #
  # The URLs point at the release the human is ABOUT to create, which is
  # the one thing here that is a promise rather than a fact: this
  # workflow deliberately publishes nothing (`contents: read`), so
  # `latest.json` names `releases/download/<tag>/<file>` and is only true
  # once the artefacts are attached to that tag under those names.
  # Step 9 of docs/RELEASING.md's checklist is where that happens.
  manifest:
    name: Updater manifest
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      # Checked out for one reason: the manifest step compares every
      # signature against the pubkey pinned in tauri.conf.json.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artefacts

      - name: Compose latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const tag = process.env.TAG;
          const base = `https://github.com/${process.env.REPO}/releases/download/${tag}`;

          // [platform key, the artefact the updater downloads]. The key
          // is what `tauri_plugin_updater` looks itself up under
          // (`<os>-<arch>`); the file is matched by suffix so a version
          // number in the name needs no pattern here.
          const wanted = [
            ["darwin-aarch64", "gavin-macos-aarch64", "aarch64.app.tar.gz"],
            ["darwin-x86_64", "gavin-macos-x86_64", "x86_64.app.tar.gz"],
            ["linux-x86_64", "gavin-linux-x86_64", ".AppImage"],
            ["windows-x86_64", "gavin-windows-x86_64", ".exe"],
          ];

          // The pinned public key, and the 8-byte key number inside it.
          //
          // This is the check Tauri does not make. Its CLI compares the
          // signing key with the configured pubkey and, on a mismatch,
          // prints a WARNING and carries on -- so a release signed with
          // the wrong key is a green build with a line of yellow text in
          // it, and the damage only appears later as every install
          // refusing every update forever. That is precisely the failure
          // mode docs/RELEASING.md exists to gate, so it is a hard error
          // here.
          //
          // Both key numbers are read the same way, out of bytes 2..10 of
          // the decoded body. Printed, that is the byte order REVERSED
          // from the hex in minisign's own `untrusted comment:` line --
          // do not "fix" it to match; what matters is that the two sides
          // are parsed identically.
          const conf = JSON.parse(fs.readFileSync("app/src-tauri/tauri.conf.json", "utf8"));
          const pubkey = conf.plugins?.updater?.pubkey ?? "";
          if (!pubkey) {
            console.error("plugins.updater.pubkey is empty; preflight should have caught this");
            process.exit(1);
          }
          const bodyLine = (blob) =>
            Buffer.from(
              Buffer.from(blob, "base64").toString("utf8").split("\n")[1],
              "base64"
            );
          const keyNumber = (buf) => buf.subarray(2, 10).toString("hex").toUpperCase();
          const expectedKeyNumber = keyNumber(bodyLine(pubkey));

          const platforms = {};
          const missing = [];
          for (const [key, artefact, suffix] of wanted) {
            const dir = path.join("artefacts", artefact);
            let file = null;
            const walk = (d) => {
              for (const entry of fs.readdirSync(d, { withFileTypes: true })) {
                const full = path.join(d, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name.endsWith(suffix)) file = full;
              }
            };
            if (fs.existsSync(dir)) walk(dir);
            if (!file) {
              missing.push(`${key}: no file ending in ${suffix} under ${dir}`);
              continue;
            }
            const sig = `${file}.sig`;
            if (!fs.existsSync(sig)) {
              missing.push(`${key}: ${path.basename(file)} has no .sig beside it`);
              continue;
            }
            const signature = fs.readFileSync(sig, "utf8").trim();
            const signedBy = keyNumber(bodyLine(signature));
            if (signedBy !== expectedKeyNumber) {
              missing.push(
                `${key}: ${path.basename(file)} was signed by key ${signedBy}, but this build ` +
                  `pins ${expectedKeyNumber} — every install would refuse this update`
              );
              continue;
            }
            platforms[key] = { signature, url: `${base}/${path.basename(file)}` };
          }

          // Hard failure, not a partial manifest: a latest.json missing
          // a platform is an install on that platform silently never
          // updating again, which is exactly the state this card exists
          // to end.
          if (missing.length) {
            console.error(missing.join("\n"));
            process.exit(1);
          }

          const manifest = {
            version: tag.replace(/^v/, ""),
            notes: `gavin ${tag}. See the release notes.`,
            pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            platforms,
          };
          fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log(JSON.stringify(manifest, null, 2));
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gavin-updater-manifest
          path: latest.json
          if-no-files-found: error
