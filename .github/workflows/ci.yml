# The repo's CI, and the thing that keeps the ports green. Every developer
# here is on a mac, so macOS is the platform that gets exercised by hand a
# hundred times a day and the other two are the ones that would silently
# rot between releases.
#
# The two jobs are deliberately at different stages. Linux is DONE: its
# suites are green and every step is a gate. Windows is a port in flight,
# so only the thing that has been made to work is a gate -- that the three
# Rust crates COMPILE for the target -- and everything past it reports
# without failing the build, until the verification pass on a real Windows
# machine turns each one into a gate.
#
# Every third-party action below is pinned to a full commit SHA (tag noted
# in a trailing comment) rather than a mutable tag -- a tag can be moved by
# whoever holds it, a SHA cannot. Bump the SHA (and the comment) by hand
# when a new release is wanted; that is a deliberate, reviewable diff
# instead of an invisible one. `permissions: contents: read` at the top
# level is the least this workflow needs: it only reads the repo, never
# writes back to it, uploads nothing, and touches no secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Rust + app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `app/src-tauri` is a workspace member, so `cargo test --workspace`
      # links against the whole WebKitGTK stack even though nothing here
      # opens a window. This is the Tauri v2 Ubuntu list.
      - name: Install the GTK/WebKit stack tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # The wasm target for the Companion shell's steps below: its build
      # and its tests carry the Companion core as a .wasm
      # (app/companion-shell/scripts/core.mjs).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # `--locked` everywhere below: CI resolves exactly the Cargo.lock /
      # package-lock.json committed to the branch, never a fresher
      # dependency picked up because the lockfile happened to be stale.
      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked

      # The daemon's fs-watcher module first and by itself, retried a
      # couple of times before it's allowed to fail the build. It is flaky
      # under full-suite cargo parallelism -- watcher timing, not the code
      # (CLAUDE.md says to re-run it alone before calling a failure a
      # regression). Running it alone up front and excluding it from the
      # sweep removes the CAUSE rather than retrying after the symptom, but
      # the isolated run itself can still lose the odd race, so it gets the
      # retry CLAUDE.md asks for on top of the isolation.
      - name: cargo test — the fs-watcher module, alone (retried)
        run: |
          for attempt in 1 2 3; do
            if cargo test -p gavin-daemon gavin:: --locked -- --test-threads=1; then
              exit 0
            fi
            echo "fs-watcher module attempt $attempt failed" >&2
          done
          echo "fs-watcher module still red after 3 attempts" >&2
          exit 1

      - name: cargo test --workspace --locked
        # Quoted: a plain YAML scalar can't end in a bare colon, and
        # "--skip gavin::" does. Unquoted, this line fails to parse.
        run: "cargo test --workspace --locked -- --skip gavin::"

      - name: npm test
        working-directory: app
        run: npm test

      - name: npm run check
        working-directory: app
        run: npm run check

      - name: npm run build
        working-directory: app
        run: npm run build

      # The Companion web bundle (app/companion). It imports the desktop's
      # library as it is, so a desktop change can break it without touching
      # a file of its own: a new Tauri import with no shim, a bootstrap
      # read the Demo Workstation cannot answer, a wire shape the sample
      # data no longer matches. After the desktop's three, which sync the
      # tsconfig its sources are compiled under.
      - name: npm run companion:test
        working-directory: app
        run: npm run companion:test

      - name: npm run companion:check
        working-directory: app
        run: npm run companion:check

      - name: npm run companion:build
        working-directory: app
        run: npm run companion:build

      # The Companion shell (app/companion-shell): the store app's own web
      # layer -- the hub and the shell's end of the bundle channel. It reads
      # the channel's message set and hosts the Demo Workstation from the
      # bundle's own sources, so a change at either end of the channel shows
      # here. Its folder installs Capacitor and nothing else; its native
      # projects need Xcode and the Android SDK and are built by hand
      # (scripts/probe.sh, its README).
      - name: npm ci (companion-shell)
        working-directory: app/companion-shell
        run: npm ci

      - name: npm run companion-shell:test
        working-directory: app
        run: npm run companion-shell:test

      - name: npm run companion-shell:check
        working-directory: app
        run: npm run companion-shell:check

      - name: npm run companion-shell:build
        working-directory: app
        run: npm run companion-shell:build

  windows:
    name: Windows (compiles)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # THE GATE. `std::os::unix` does not exist on this target, so before
      # the windows-port card these three crates did not fail to run on
      # Windows -- they failed to parse. Keeping that answer honest is what
      # this job is for, and it is the one step here allowed to be red.
      #
      # These three and not `--workspace`: app/src-tauri drags in the whole
      # WebView2 and tauri-build chain, which is a different question with a
      # different failure mode. It is checked below, where a failure reports
      # instead of blocking.
      - name: cargo check — the daemon, the MCP server and the protocol
        run: cargo check -p protocol -p gavin-daemon -p gavin-mcp --locked

      # The Device wire's two crates, beside the three above and a gate
      # for their reason. The daemon already pulls the Relay's client in,
      # so what this adds is the Relay itself -- the one part of the
      # workspace on an async runtime -- and the Companion core.
      - name: cargo check — the Relay and the Companion core
        run: cargo check -p gavin-relay -p companion-core --all-features --locked

      # The rest of this job was written to report rather than gate, so
      # that an unfinished port could not block a push; each step becomes
      # a gate as it goes green. Two `npm` steps and this one have, on
      # 2026-09-11.
      #
      # A GATE now: the whole workspace, tests included, compiles for
      # this target. Proved by more than `check` -- the full suite was
      # built and RUN on Windows 11 that day, so the tauri-build and
      # WebView2 chain this pulls in is known to link here and not only
      # to parse.
      - name: cargo check --workspace --tests
        run: cargo check --workspace --tests --locked

      # Same carve-out as the Linux job: the fs-watcher module is flaky
      # under full-suite parallelism (watcher timing, not the code), so it
      # runs alone and is skipped in the sweep. This job already reports
      # instead of gating, so it doesn't need the Linux job's retry loop.
      - name: cargo test — the fs-watcher module, alone
        continue-on-error: true
        timeout-minutes: 20
        # Quoted: "gavin:: --locked" contains a colon-space, which a plain
        # YAML scalar can't carry without being mistaken for a mapping key.
        run: "cargo test -p gavin-daemon gavin:: --locked -- --test-threads=1"

      # `timeout-minutes` on both, and it is not belt-and-braces:
      # `server::tests` DEADLOCKS on Windows -- observed twice on
      # 2026-09-11, stalling at ~22 failures with 200+ threads and zero
      # CPU, once with `--skip git_status --skip repo` so the slow
      # fs-watcher tests are not the explanation. `continue-on-error`
      # does not help with a hang: without a cap the step would sit here
      # until the job's six-hour default, on every push, and still report
      # nothing. A killed step reports the same "not finished yet" this
      # job was built to report, in twenty minutes instead of six hours.
      - name: cargo test --workspace --locked
        continue-on-error: true
        timeout-minutes: 20
        # Quoted for the same reason as the Linux job's equivalent step: a
        # plain scalar can't end in a bare colon, and this one does.
        run: "cargo test --workspace --locked -- --skip gavin::"

      # A GATE now. Two things had kept it a report and both are gone.
      # The ten source-grep tests that failed here on a CRLF checkout
      # pass now that `.gitattributes` pins every text file to LF on
      # every OS (`fix-source-grep-tests-on-crlf-checkouts`), so a line
      # ending no longer separates this runner from the Linux one; and
      # the suite's own baseline -- 12 tests in 8 files red on a clean
      # checkout on 2026-09-22, mock shape and source-grep drift, none
      # of it about line endings or this platform -- went green on main
      # that same day and has stayed green, 281 files and 6184 tests.
      # There is no longer a failure here this job did not cause, which
      # is the condition the old comment set for promoting it, so a red
      # here is a real regression in the app.
      - name: npm test
        working-directory: app
        run: npm test

      # GATES from here: both measured green on Windows 11 on 2026-09-11
      # (`feat-windows-port-on-a-windows-machine` §1) -- `check` at 0
      # errors, `build` writing its static output -- and neither reads a
      # source file as bytes, so neither is exposed to the CRLF problem
      # above. A red here is a real regression in the port.
      - name: npm run check
        working-directory: app
        run: npm run check

      - name: npm run build
        working-directory: app
        run: npm run build

  # The protocol crate without its operating-system parts, and the
  # Companion core, for the target the core is built to. Its own small job
  # rather than a step in `linux`: it needs none of the GTK/WebKit stack or
  # node, and a red here should say "the protocol crate grew an OS
  # dependency" -- or "the core grew one" -- rather than sit at the bottom
  # of a twenty-minute job.
  #
  # `-p` and not `--workspace`: only these two are meant to build for
  # wasm, and the workspace's other members (the daemon, the Relay, the
  # app host) are the OS-specific ones by design. The native test run
  # without the feature keeps the same code proven where the suite can
  # execute it -- the pairing SAS and its pinned vector included.
  wasm:
    name: Protocol and Companion core for WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo check — the protocol crate for wasm32-unknown-unknown
        run: cargo check -p protocol --no-default-features --target wasm32-unknown-unknown --locked

      - name: cargo test — the protocol crate without the os feature
        run: cargo test -p protocol --no-default-features --locked

      # Without `test-device`, which is the native build's and brings a
      # socket with it. What is checked is the core the shell will run:
      # a Noise handshake with no OS random source linked, because on
      # this target there is none.
      - name: cargo check — the Companion core for wasm32-unknown-unknown
        run: cargo check -p companion-core --target wasm32-unknown-unknown --locked

      # Linked, not just checked: the module the shell carries, built the
      # way its pipeline builds it. That it imports nothing is proved in
      # the linux job, where the shell's tests instantiate it with an
      # empty import object.
      - name: cargo build — the Companion core's module for the shell
        run: cargo build -p companion-wasm --target wasm32-unknown-unknown --profile companion-wasm --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # cargo-audit's default exit code is non-zero only for advisories
      # without an informational tag -- an actual vulnerability. Advisories
      # tagged "unmaintained" (and other informational tags) print as
      # warnings and don't fail the step. That split is the behaviour the
      # card asks for; it comes free of any --deny flag, and adding one
      # would turn "unmaintained" into a build-breaker instead of a warning.
      - name: cargo audit
        run: cargo audit

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # npm has no "unmaintained" class to downgrade to a warning the way
      # cargo-audit does -- every reported advisory is a vulnerability, and
      # npm audit's default exit code already fails on any of them.
      - name: npm audit (production dependencies)
        working-directory: app
        run: npm audit --omit=dev
