<rect x="316" y="81" width="618" height="26" rx="4" fill="#232323"/>
<text x="322" y="98" fill="#eee" font-size="13"><tspan fill="#999">&gt; </tspan><tspan>Fix the login flow: the session cookie is dropped after the redirect</tspan></text>
<circle cx="326" cy="134" r="3.5" fill="#999"/>
<text x="340" y="138" fill="#eee" font-size="13"><tspan fill="#eee">Read </tspan><tspan fill="#bbb">src/auth/session.ts</tspan><tspan fill="#666">  212 lines</tspan></text>
<circle cx="326" cy="154" r="3.5" fill="#999"/>
<text x="340" y="158" fill="#eee" font-size="13"><tspan fill="#eee">Read </tspan><tspan fill="#bbb">src/routes/login/+page.server.ts</tspan><tspan fill="#666">  88 lines</tspan></text>
<circle cx="326" cy="194" r="3.5" fill="#eee"/>
<text x="340" y="198" fill="#eee" font-size="13"><tspan>The redirect handler builds a fresh Response and never copies</tspan></text>
<text x="340" y="218" fill="#eee" font-size="13"><tspan>the Set-Cookie header across. Patching it and adding a test.</tspan></text>
<circle cx="326" cy="254" r="3.5" fill="#8bc98b"/>
<text x="340" y="258" fill="#eee" font-size="13"><tspan fill="#eee">Update </tspan><tspan fill="#bbb">src/auth/redirect.ts</tspan><tspan fill="#666">  +3 -1</tspan></text>
<text x="340" y="284" fill="#eee" font-size="13"><tspan fill="#666">40 </tspan><tspan fill="#999">    const headers = new Headers({ location: target })</tspan></text>
<rect x="334" y="289" width="600" height="20" rx="0" fill="#3a1a1a"/>
<text x="340" y="304" fill="#eee" font-size="13"><tspan fill="#666">41 </tspan><tspan fill="#e08a8a">-   return new Response(null, { status: 303, headers })</tspan></text>
<rect x="334" y="309" width="600" height="20" rx="0" fill="#17301a"/>
<text x="340" y="324" fill="#eee" font-size="13"><tspan fill="#666">41 </tspan><tspan fill="#8bc98b">+   const res = new Response(null, { status: 303, headers })</tspan></text>
<rect x="334" y="329" width="600" height="20" rx="0" fill="#17301a"/>
<text x="340" y="344" fill="#eee" font-size="13"><tspan fill="#666">42 </tspan><tspan fill="#8bc98b">+   res.headers.append('set-cookie', session.cookie())</tspan></text>
<rect x="334" y="349" width="600" height="20" rx="0" fill="#17301a"/>
<text x="340" y="364" fill="#eee" font-size="13"><tspan fill="#666">43 </tspan><tspan fill="#8bc98b">+   return res</tspan></text>
<text x="340" y="384" fill="#eee" font-size="13"><tspan fill="#666">44 </tspan><tspan fill="#999">  }</tspan></text>
<circle cx="326" cy="420" r="3.5" fill="#8bc98b"/>
<text x="340" y="424" fill="#eee" font-size="13"><tspan fill="#eee">Update </tspan><tspan fill="#bbb">src/auth/redirect.test.ts</tspan><tspan fill="#666">  +22</tspan></text>
<circle cx="326" cy="460" r="3.5" fill="#8bc98b"/>
<text x="340" y="464" fill="#eee" font-size="13"><tspan fill="#eee">Bash </tspan><tspan fill="#bbb">npm test -- auth</tspan></text>
<text x="340" y="484" fill="#eee" font-size="13"><tspan fill="#999"> Test Files  </tspan><tspan fill="#8bc98b">3 passed</tspan><tspan fill="#999"> (3)</tspan></text>
<text x="340" y="504" fill="#eee" font-size="13"><tspan fill="#999">      Tests  </tspan><tspan fill="#8bc98b">24 passed</tspan><tspan fill="#999"> (24)</tspan></text>
<circle cx="326" cy="540" r="3.5" fill="#eee"/>
<text x="340" y="544" fill="#eee" font-size="13"><tspan>Fixed. The cookie now survives the redirect; the new test fails</tspan></text>
<text x="340" y="564" fill="#eee" font-size="13"><tspan>on the old handler and passes on this one.</tspan></text>
<circle cx="326" cy="600" r="3.5" fill="#8bc98b"/>
<text x="340" y="604" fill="#eee" font-size="13"><tspan fill="#eee">gavin_set_plan_field </tspan><tspan fill="#bbb">fix-login-flow.md  status = Done</tspan></text>
<circle cx="326" cy="640" r="3.5" fill="#4a9eff"/>
