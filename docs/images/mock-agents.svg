<text x="972" y="98" fill="#eee" font-size="13"><tspan fill="#999">&gt; </tspan><tspan>Cart total and invoice total disagree by a cent on some orders</tspan></text>
<circle cx="976" cy="134" r="3.5" fill="#999"/>
<text x="990" y="138" fill="#eee" font-size="13"><tspan fill="#eee">Read </tspan><tspan fill="#bbb">src/cart/totals.ts</tspan><tspan fill="#666">  140 lines</tspan></text>
<circle cx="976" cy="154" r="3.5" fill="#999"/>
<text x="990" y="158" fill="#eee" font-size="13"><tspan fill="#eee">Read </tspan><tspan fill="#bbb">src/billing/invoice.ts</tspan><tspan fill="#666">  306 lines</tspan></text>
<circle cx="976" cy="194" r="3.5" fill="#eee"/>
<text x="990" y="198" fill="#eee" font-size="13"><tspan>The cart sums first and rounds once; the invoice rounds each</tspan></text>
<text x="990" y="218" fill="#eee" font-size="13"><tspan>line and then sums. Both are defensible, so this one is yours:</tspan></text>
<text x="990" y="238" fill="#eee" font-size="13"><tspan>which total is the source of truth?</tspan></text>
<rect x="966" y="260" width="618" height="92" rx="6" fill="#3a3320" stroke="#a15c2f"/>
<text x="980" y="286" fill="#eee" font-size="13"><tspan fill="#d9a648" font-weight="600">&gt; 1. Round per line, then sum</tspan><tspan fill="#999">    matches the invoice</tspan></text>
<text x="980" y="310" fill="#eee" font-size="13"><tspan fill="#ddd">  2. Sum first, round once</tspan><tspan fill="#999">       matches the cart</tspan></text>
<text x="980" y="334" fill="#eee" font-size="13"><tspan fill="#ddd">  3. Something else</tspan></text>
