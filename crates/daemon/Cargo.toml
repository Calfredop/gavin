[package]
name = "gavin-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gavin-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.8"

[dev-dependencies]
tempfile = "3"
