[package]
name = "gavin-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gavin-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.8"
protocol = { path = "../protocol" }
notify = "8"
notify-debouncer-mini = "0.7"
toml = "0.8"
toml_edit = "0.22"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"

# `proc.rs` reaches for libc on the two unix arms and for Win32 on the
# third; neither exists on the other's target, and both are absent from
# the platform-independent build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  # `GetLocalTime` only -- the civil date a human item's Answer/Result
  # line is stamped with, in the human's own timezone rather than UTC.
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
