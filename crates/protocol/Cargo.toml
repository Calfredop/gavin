[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"

# `Stream::server_pid` only. A connected socket knows which process is on
# the other end of it, but std does not expose that on any unix -- the
# accessors are still unstable -- so the `getsockopt` behind it is spelled
# here. The Windows arm asks `GetNamedPipeServerProcessId` instead and
# needs nothing new.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only the Windows arms of `transport` and `random_hex` reach for this,
# and only for the named-pipe, security-descriptor and CSPRNG calls they
# make; a mac or Linux build never sees it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_IO",
] }
